# Pre-commit hooks for code quality
# Installation: pip install pre-commit
# Activation: pre-commit install
# Usage: Runs automatically on git commit
#
# Note: Terraform hooks disabled due to Windows compatibility issues
# Use test-terraform.ps1 for local Terraform validation instead

repos:
  # DISABLED: Terraform hooks cause issues on Windows
  # Use test-terraform.ps1 instead for local validation
  # Terraform checks run automatically in GitHub Actions CI/CD
  #
  # - repo: https://github.com/antonbabenko/pre-commit-terraform
  #   rev: v1.88.0
  #   hooks:
  #     - id: terraform_fmt
  #     - id: terraform_validate
  #     - id: terraform_tfsec
  #     - id: terraform_docs

  # Generic hooks (work well on all platforms)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
      - id: check-merge-conflict
        name: Check for merge conflicts
