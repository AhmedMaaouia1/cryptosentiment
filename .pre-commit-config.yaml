# Pre-commit hooks for Terraform
# Installation: pip install pre-commit
# Activation: pre-commit install
# Usage: Runs automatically on git commit

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
        name: Terraform Format

      - id: terraform_validate
        name: Terraform Validate

      # Disabled: tfsec runs in CI/CD with .tfsec.yml config
      # - id: terraform_tfsec
      #   name: Terraform Security (tfsec)
      #   args:
      #     - --args=--config-file=.tfsec.yml
      
      # Disabled: terraform-docs not installed locally
      # - id: terraform_docs
      #   name: Generate Terraform docs
      #   args:
      #     - --args=--output-file=README.md
      #     - --args=--output-mode=inject  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
      - id: check-merge-conflict
        name: Check for merge conflicts
