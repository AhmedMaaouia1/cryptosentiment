name: Terraform Validation & Security

on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform-validation.yml'
  push:
    branches:
      - main
      - feat/terraform-modularisation
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

env:
  TF_VERSION: '1.8.0'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  terraform-checks:
    name: Terraform Quality & Security Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: |
          terraform fmt -check -recursive
          echo "Code is properly formatted"
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          terraform init -backend=false
          echo "Terraform initialized"

      - name: Terraform Validate
        id: validate
        run: |
          terraform validate -no-color
          echo "Configuration is valid"

      - name: Run tfsec Security Scan
        id: tfsec
        run: |
          if [ -f .tfsec.yml ]; then
            tfsec . --format sarif --out tfsec-results.sarif --config-file .tfsec.yml
          else
            tfsec . --format sarif --out tfsec-results.sarif --minimum-severity HIGH
          fi
        continue-on-error: true

      - name: Upload tfsec results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: infrastructure/terraform/tfsec-results.sarif
          category: tfsec

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fmtStatus = '${{ steps.fmt.outcome }}' === 'success' ? 'PASSED' : 'FAILED';
            const validateStatus = '${{ steps.validate.outcome }}' === 'success' ? 'PASSED' : 'FAILED';
            const tfsecStatus = '${{ steps.tfsec.outcome }}' === 'success' ? 'PASSED' : 'ISSUES FOUND';

            const fmtError = '${{ steps.fmt.outcome }}' !== 'success' ? '**Format errors found.** Run `terraform fmt -recursive` locally.\n' : '';
            const validateError = '${{ steps.validate.outcome }}' !== 'success' ? '**Validation errors found.** Check Terraform configuration.\n' : '';
            const tfsecError = '${{ steps.tfsec.outcome }}' !== 'success' ? '**Security issues detected.** Review the Security tab for details.\n' : '';

            const output = `
            ## Terraform Validation Results

            | Check | Status |
            |-------|--------|
            | Format | ${fmtStatus} |
            | Validate | ${validateStatus} |
            | Security (tfsec) | ${tfsecStatus} |

            ### Actions Required

            ${fmtError}${validateError}${tfsecError}

            ---
            *Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail on critical errors
        if: steps.fmt.outcome != 'success' || steps.validate.outcome != 'success' || steps.tfsec.outcome != 'success'
        run: |
          echo "::error::Terraform validation failed. Please fix the errors above."
          exit 1

  checkov-scan:
    name: Checkov Policy Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov
